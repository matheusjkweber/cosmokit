name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If this job fails with "Timeout reached, aborting!" the Pages queue is
      # backed up, not the build. The action waits 10 minutes then *cancels*
      # the deployment, and that cancelled state is keyed on the commit SHA:
      # re-running the same commit then fails instantly with "Deployment
      # cancelled", and the dead deployment still holds the lock, so the next
      # commit gets "400 ... due to in progress deployment".
      # Raising the `timeout` input does not help - it is capped at 600000.
      # Recover with:
      #   gh api -X POST repos/OWNER/REPO/pages/deployments/<stuck-sha>/cancel
      # then push a new commit. The artifact sometimes publishes server-side
      # anyway, so check the live site before assuming a red run means no deploy.
      - id: deployment
        uses: actions/deploy-pages@v4
