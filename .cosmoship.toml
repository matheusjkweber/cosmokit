[project]
name = "cosmokit"

[targets.backend]
kind = "container-azure"
after = ["landing"]
context = "backend"
registry = "ghcr.io/maththedev42"
image = "cosmokit-api"
resource_group = "cosmokit"
container_app = "cosmokit-api"
verify_url = "https://api.usecosmoskittool.com/v1/helper/latest"
verify_json_path = "latestVersion"
version_from = { file = "backend/internal/content/data.json", json_path = "helper.latestVersion" }

[targets.landing]
kind = "static-site"
after = ["helper"]
build = "npm run build"
output = "out"
branch = "gh-pages"
verify_url = "https://usecosmoskittool.com/"
must_publish = [{ from = "public/downloads/CosmoKitProxyHelper.pkg", to = "downloads/CosmoKitProxyHelper.pkg" }]

[targets.helper]
kind = "macos-pkg"
package_path = "CosmoKit/ProxyHelper"
identifier = "apps.mjkweber.CosmoKit.ProxyHelper.pkg"
version_from = { file = "CosmoKit/ProxyHelper/Sources/CosmoKitProxyHelper/main.swift", regex = '^let HelperVersion = "(.+)"$' }
notary_profile = "cosmokit-notary"
publish_to = "public/downloads/CosmoKitProxyHelper.pkg"
published_url = "https://usecosmoskittool.com/downloads/CosmoKitProxyHelper.pkg"

[targets.app]
kind = "macos-app"
fastlane_dir = "CosmoKit"
lane = "mac deploy"
xcodeproj = "CosmoKit/CosmoKit.xcodeproj"
scheme = "CosmoKit"
